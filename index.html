<script>
  // ============================================================
  // CONFIGURAZIONE
  // ============================================================
  // ATTENZIONE:
  // - NON lasciare token GitHub nel browser in produzione
  // - usa un backend o un secret server-side per scrivere sul repo
  // - qui manteniamo un fallback locale per non far crashare l'app
  const GITHUB_TOKEN = "";
  const GITHUB_OWNER = "ginola70-footgolf";
  const GITHUB_REPO = "GestAppart";
  const GITHUB_BRANCH = "main";
  const GITHUB_FILE = "data.json";
  const CACHE_KEY = "gestappart-cache";

  const state = {
    editingId: null,
    confirmAction: null
  };

  function toast(msg, type = "success") {
    const t = document.createElement("div");
    t.className = "toast " + type;
    t.textContent = (type === "success" ? "✓ " : "✗ ") + msg;
    document.getElementById("toastContainer").appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  function openModal(id) {
    document.getElementById(id).classList.add("open");
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove("open");
    if (id === "modalConfirm") {
      state.confirmAction = null;
    } else {
      state.editingId = null;
    }
  }

  document.querySelectorAll(".modal-overlay").forEach((o) => {
    o.addEventListener("click", (e) => {
      if (e.target === o) o.classList.remove("open");
    });
  });

  function fmtEur(n) {
    const value = Number(n) || 0;
    return "€ " + value.toLocaleString("it-IT", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function fmtDate(s) {
    return s ? new Date(s + "T00:00:00").toLocaleDateString("it-IT") : "";
  }

  function daysDiff(s) {
    return Math.round((new Date(s + "T00:00:00") - new Date()) / 86400000);
  }

  function normalizeString(value) {
    return (value ?? "").toString().trim();
  }

  function sanitizePiano(value) {
    const v = normalizeString(value).replace(/°/g, "").trim();
    return v === "" ? "" : v;
  }

  function sanitizeNumero(value, fallback = "") {
    const v = normalizeString(value).replace(",", ".");
    if (v === "") return fallback;
    const num = Number(v);
    return Number.isFinite(num) ? num : fallback;
  }

  // ============================================================
  // DB JSON locale + GitHub backup
  // ============================================================
  function decodeBase64UTF8(str) {
    try {
      return decodeURIComponent(
        atob(str)
          .split("")
          .map((c) => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2))
          .join("")
      );
    } catch {
      return atob(str);
    }
  }

  async function fetchGitHubJson() {
    if (!GITHUB_TOKEN) {
      throw new Error("Token GitHub non configurato");
    }

    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}?ref=${GITHUB_BRANCH}`;

    const response = await fetch(url, {
      headers: {
        Authorization: `Bearer ${GITHUB_TOKEN}`,
        Accept: "application/vnd.github.v3+json"
      }
    });

    if (!response.ok) {
      throw new Error(`Errore lettura GitHub: ${response.status}`);
    }

    const raw = await response.json();
    if (!raw.content) {
      throw new Error("File data.json vuoto o non accessibile");
    }

    return JSON.parse(decodeBase64UTF8(raw.content));
  }

  async function saveGitHubJson(data) {
    if (!GITHUB_TOKEN) {
      throw new Error("Token GitHub non configurato");
    }

    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;

    const getCurrent = await fetch(`${url}?ref=${GITHUB_BRANCH}`, {
      headers: {
        Authorization: `Bearer ${GITHUB_TOKEN}`,
        Accept: "application/vnd.github.v3+json"
      }
    });

    if (!getCurrent.ok) {
      throw new Error(`Impossibile leggere file JSON: ${getCurrent.status}`);
    }

    const currentFile = await getCurrent.json();
    const payload = JSON.stringify(data, null, 2);
    const encoded = btoa(unescape(encodeURIComponent(payload)));

    const response = await fetch(url, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${GITHUB_TOKEN}`,
        "Content-Type": "application/json",
        Accept: "application/vnd.github.v3+json"
      },
      body: JSON.stringify({
        message: `Aggiornamento dati ${new Date().toISOString()}`,
        content: encoded,
        sha: currentFile.sha,
        branch: GITHUB_BRANCH
      })
    });

    if (!response.ok) {
      const txt = await response.text();
      throw new Error(`Errore scrittura GitHub: ${response.status} - ${txt}`);
    }

    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    return true;
  }

  const DB = {
    uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6),

    async get() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) return JSON.parse(cached);

        const data = await fetchGitHubJson();
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        return data;
      } catch (error) {
        console.error("DB.get error:", error);
        const local = localStorage.getItem(CACHE_KEY);
        if (local) return JSON.parse(local);
        toast("Errore nel caricamento dei dati dal server", "error");
        return { apt: [], spese: [], scadenze: [] };
      }
    },

    async set(data) {
      try {
        await saveGitHubJson(data);
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        return true;
      } catch (error) {
        console.error("DB.set error:", error);

        // fallback locale: salva comunque in localStorage
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        toast("Salvataggio locale eseguito. Controlla la config GitHub", "error");
        return true;
      }
    }
  };

  // ============================================================
  // APPARTAMENTI
  // ============================================================
  async function openAptModal(id = null) {
    state.editingId = id;
    const d = await DB.get();
    const apt = id ? (d.apt || []).find(a => a.id === id) : {};

    document.getElementById("modalAptTitle").textContent = id ? "Modifica appartamento" : "Nuovo appartamento";
    document.getElementById("aptNome").value = apt?.nome || "";
    document.getElementById("aptAddr").value = apt?.addr || "";
    document.getElementById("aptPiano").value = apt?.piano || "";
    document.getElementById("aptMq").value = apt?.mq ?? "";
    document.getElementById("aptNote").value = apt?.note || "";

    openModal("modalApt");
  }

  async function saveApt() {
    const nome = normalizeString(document.getElementById("aptNome").value);
    if (!nome) {
      toast("Inserisci un nome", "error");
      return;
    }

    const pianoRaw = document.getElementById("aptPiano").value;
    const mqRaw = document.getElementById("aptMq").value;

    const d = await DB.get();
    const apt = {
      id: state.editingId || DB.uid(),
      nome,
      addr: normalizeString(document.getElementById("aptAddr").value),
      piano: sanitizePiano(pianoRaw),
      mq: sanitizeNumero(mqRaw, ""),
      note: normalizeString(document.getElementById("aptNote").value)
    };

    if (state.editingId) {
      const idx = (d.apt || []).findIndex(a => a.id === state.editingId);
      if (idx !== -1) {
        d.apt[idx] = { ...d.apt[idx], ...apt };
      }
    } else {
      d.apt = d.apt || [];
      d.apt.push(apt);
    }

    await DB.set(d);
    closeModal("modalApt");
    renderApt();
    populateSelectOptions();
    renderDashboard();
    toast("Appartamento salvato", "success");
  }

  async function saveSpesa() {
    const data = document.getElementById("spData").value;
    const importo = sanitizeNumero(document.getElementById("spImporto").value, null);
    const appartamentoId = document.getElementById("spApt").value;
    const causale = document.getElementById("spCausale").value;

    if (!data || importo === null || !appartamentoId || !causale) {
      toast("Completa tutti i campi obbligatori", "error");
      return;
    }

    const d = await DB.get();
    const entry = {
      id: state.editingId || DB.uid(),
      data,
      importo: Number(importo.toFixed(2)),
      appartamentoId,
      causale,
      dettaglio: normalizeString(document.getElementById("spDettaglio").value),
      fornitore: normalizeString(document.getElementById("spFornitore").value),
      ricevuta: normalizeString(document.getElementById("spRicevuta").value)
    };

    if (state.editingId) {
      const idx = (d.spese || []).findIndex(x => x.id === state.editingId);
      if (idx !== -1) d.spese[idx] = { ...d.spese[idx], ...entry };
    } else {
      d.spese = d.spese || [];
      d.spese.push(entry);
    }

    await DB.set(d);
    closeModal("modalSpesa");
    renderSpese();
    renderDashboard();
    renderReport();
    populateFilters();
    populateReportFilters();
    toast("Spesa salvata", "success");
  }

  async function saveScad() {
    const data = document.getElementById("scData").value;
    const descrizione = normalizeString(document.getElementById("scDesc").value);
    if (!data || !descrizione) {
      toast("Inserisci data e descrizione", "error");
      return;
    }

    const d = await DB.get();
    const entry = {
      id: state.editingId || DB.uid(),
      data,
      appartamentoId: document.getElementById("scApt").value || "",
      descrizione,
      causale: document.getElementById("scCausale").value || "",
      importo: sanitizeNumero(document.getElementById("scImporto").value, 0),
      note: normalizeString(document.getElementById("scNote").value)
    };

    if (state.editingId) {
      const idx = (d.scadenze || []).findIndex(x => x.id === state.editingId);
      if (idx !== -1) d.scadenze[idx] = { ...d.scadenze[idx], ...entry };
    } else {
      d.scadenze = d.scadenze || [];
      d.scadenze.push(entry);
    }

    await DB.set(d);
    closeModal("modalScad");
    renderScadenze();
    renderDashboard();
    toast("Scadenza salvata", "success");
  }

  // ============================================================
  // INIZIO APP
  // ============================================================
  async function initApp() {
    const data = await DB.get();
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    populateSelectOptions();
    populateFilters();
    populateScadFilters();
    populateReportFilters();
    renderApt();
    renderSpese();
    renderScadenze();
    renderReport();
    renderDashboard();
    showSection("dashboard");
  }

  document.getElementById("confirmOk").addEventListener("click", deleteConfirmed);
  initApp();
</script>
